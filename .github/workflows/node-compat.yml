# Measure zun-node against Node.js 25's own test suite.
#
# The job builds the Zun engine (and, for extension modules, this repo's
# cdylib), downloads the Node `test-<module>*.js` files at a pinned tag, runs
# each through `zun`, and renders the pass percentage into the README and
# test/<module>/RESULTS.md. The tests are never vendored — they are fetched at
# run time by tools/run_node_tests.sh.
#
# All three module kinds are measured (see ../../PLAN.md):
#   * `util`, `path`, `events`, `buffer`, `string_decoder`, `querystring`,
#     `punycode` and `url` are Zun TypeScript, so they need only the `zun`
#     binary: each test is bundled by tools/bundle_node_test.sh and run as
#     `zun run <bundle.ts>`, with no --ext. (`buffer` is TypeScript although
#     `Buffer` itself is an engine realm global: the module is the surface
#     around that global, not a second Buffer — see test/buffer/README.md.)
#   * `os` and `fs` are Zun TypeScript *over* a Rust zun_abi cdylib, so they
#     need both: the bundle from tools/bundle_node_test.sh and `--ext`. The
#     cdylib is therefore built before either is measured.
#
# zun-node is a submodule of the engine, and its Cargo path dependency on
# `../crates/zun_abi` assumes it sits inside the engine checkout at
# `zun/zun-node`. The workflow reproduces that layout: it checks out the engine,
# then checks this repo out into `engine/zun-node`.
name: node-compat

on:
  workflow_dispatch:
    inputs:
      module:
        description: Node module to measure (util, path, events, buffer, string_decoder, querystring, punycode, url, timers, os, fs, child_process, … or "all")
        default: all
      limit:
        description: Only the first N tests (0 = all)
        default: "0"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Zun engine
        uses: actions/checkout@v4
        with:
          repository: UrubuCode/zun
          path: engine

      - name: Checkout zun-node into the engine layout
        uses: actions/checkout@v4
        with:
          path: engine/zun-node

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            engine/zun-node

      - name: Build the zun binary
        working-directory: engine
        run: cargo build -p zun_cli

      # The cdylib must exist before `os` and `fs` are measured: their bundles
      # resolve `import * as native from "node:<module>"` through it.
      - name: Build the zun-node extension
        working-directory: engine/zun-node
        run: cargo build

      - name: Test the zun-node extension
        working-directory: engine/zun-node
        run: cargo test

      - name: Run the Node test tracker
        working-directory: engine
        run: |
          set -eu
          MODULE="${{ github.event.inputs.module || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          ZUN="$PWD/target/debug/zun"
          EXT="$PWD/zun-node/target/debug/libzun_node.so"
          case "$MODULE" in
            all) MODULES="util path events buffer string_decoder querystring punycode url timers os fs child_process";;
            *)   MODULES="$MODULE";;
          esac
          test -f "$EXT" || { echo "extension cdylib missing: $EXT" >&2; exit 1; }
          for m in $MODULES; do
            # A pure Zun TypeScript module takes no --ext. An extension module
            # needs it, and so does a TypeScript-over-natives module (`os`),
            # whose bundle calls into the cdylib.
            case "$m" in
              util|path|events|buffer|string_decoder|querystring|punycode|url|timers) EXT_ARGS="";;
              *)           EXT_ARGS="--ext $EXT";;
            esac
            bash zun-node/tools/run_node_tests.sh \
              --zun "$ZUN" \
              $EXT_ARGS \
              --module "$m" \
              --limit "$LIMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: node-compat-results
          path: |
            engine/zun-node/README.md
            engine/zun-node/test/**/RESULTS.md
