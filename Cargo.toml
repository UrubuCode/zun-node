[package]
name = "zun_node"
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UrubuCode/zun-node"
description = "Node.js-compatible library for the Zun platform, as a native zun_abi extension"

# A native Zun extension is a dynamic library the host loads and whose
# `zun_register_v1` entry point it calls. `rlib` is kept so the modules can also
# be unit-tested as plain Rust.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The stable, host-facing extension ABI. Only this — an extension carries no VM,
# interpreter, or allocator dependency. Path dependency while developed inside
# the Zun workspace checkout; a release pins a published/git `zun_abi`.
zun_abi = { path = "../crates/zun_abi" }

# ---------------------------------------------------------------------------
# Compression backends for `node:zlib`.
#
# Node's `zlib` is a thin layer over zlib, Brotli and zstd, and the one hard
# requirement the corpus imposes is **byte-for-byte agreement with zlib** for
# the same parameters (`test-zlib-params.js`, `test-zlib-dictionary.js` and
# `test-zlib-from-gzip.js` all compare bytes or round-trip through fixtures
# produced by the real library). That rules out `miniz_oxide`, which is
# deliberately not output-compatible and offers neither `windowBits`,
# `memLevel`, `strategy`, dictionaries nor `deflateParams`.
#
# `libz-rs-sys` is the C API surface of `zlib-rs`, a memory-safe Rust rewrite
# of zlib whose stated goal is being a drop-in replacement producing identical
# output. It exposes exactly the entry points Node's `node_zlib.cc` calls --
# `deflateInit2_`, `inflateInit2_`, `deflate`, `inflate`, `deflateParams`,
# `deflateSetDictionary`, `inflateSetDictionary`, `deflateReset`,
# `inflateReset`, `crc32` -- so `src/zlib/zstream.rs` can follow that file line
# by line instead of reinventing the state machine. It is pure Rust (no `cc`,
# no vendored C), which keeps this extension buildable with nothing but a Rust
# toolchain, the same bar `os`/`fs`/`process` hold.
#
# `brotli` is the reference Brotli implementation ported to Rust by the same
# route, and its streaming encoder/decoder take the very operations Node's
# `BROTLI_OPERATION_*` flush flags name.
#
# zstd (Node 25 added `zstdCompress`/`ZstdCompress`) is deliberately absent:
# every pure-Rust zstd crate today is decompression-only, and a C-backed one
# would break the no-`cc` rule above. See `../test/zlib/README.md`.
[dependencies.libz-rs-sys]
version = "0.6"
default-features = false
features = ["std", "rust-allocator"]

[dependencies.brotli]
version = "9"
default-features = false
features = ["std"]

# `brotli`'s own decoder half, which it re-exports only partly: the decoder
# error *code* and its name (what Node reports as the error's `code`) are
# public in this crate but not among `brotli`'s re-exports, and a Node-accurate
# error is the whole point of naming it. `brotli` depends on this exact crate,
# so the two resolve to one copy and the `BrotliState` types unify.
[dependencies.brotli-decompressor]
version = "6"
default-features = false
features = ["std"]

# ---------------------------------------------------------------------------
# Platform syscall bindings, target-gated so neither reaches the other OS.
#
# `node:os` is almost entirely syscalls, and the ones it needs are not in
# `std`: there is no std API for `getifaddrs`, `getpwuid`, `getpriority`, nor
# for `GetAdaptersAddresses` / `GlobalMemoryStatusEx` / `NtQuerySystemInformation`.
# The two crates below are the ecosystem's canonical *raw binding* crates — no
# abstraction, no transitive dependencies of their own beyond the per-arch
# Windows import libraries — which is exactly the shape an extension that
# "carries no VM, interpreter, or allocator dependency" (PLAN.md principle 2)
# can accept. Everything that `std` does cover (`available_parallelism`,
# `/proc` reads, `env`) is still taken from `std`.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # `NtQuerySystemInformation`, the only source of per-processor CPU times.
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    # `node:process` needs the process-wide Win32 facts libuv reads:
    # `CreateToolhelp32Snapshot` for the parent pid, `GetProcessMemoryInfo` for
    # the resident set size and `PeakWorkingSetSize`, and the console title.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    # `node:fs` needs the file APIs `std` does not cover: the per-file
    # `dev`/`ino`/`nlink` of `stat` (`GetFileInformationByHandle`), the
    # `FILE_ATTRIBUTE_READONLY` reading of `access`/`chmod`
    # (`Get`/`SetFileAttributesW`), `utimes` (`SetFileTime`) and `statfs`
    # (`GetDiskFreeSpace*`).
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
